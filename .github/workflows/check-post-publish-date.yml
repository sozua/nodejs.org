# Security Notes
# This workflow uses `pull_request_target`, so will run against all PRs automatically (without approval), be careful with allowing any user-provided code to be run here
# Only selected Actions are allowed within this repository. Please refer to (https://github.com/nodejs/nodejs.org/settings/actions)
# for the full list of available actions. If you want to add a new one, please reach out a maintainer with Admin permissions.
# REVIEWERS, please always double-check security practices before merging a PR that contains workflow changes!!
# AUTHORS, please only use actions with explicit SHA references, and avoid using `@master` or `@main` references or `@version` tags.
# MERGE QUEUE NOTE: This workflow runs on both `pull_request_target` and `merge_group` to ensure blog post dates are validated before merging

name: Check Blog Post Publish Dates

on:
  pull_request_target:
    paths:
      - 'apps/site/pages/en/blog/**/*.md'
  merge_group:

defaults:
  run:
    working-directory: ./

permissions:
  contents: read
  actions: read

jobs:
  check-dates:
    name: Check for future blog post dates
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Git Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - uses: nodejs/web-team/actions/setup-environment@2c2897a93eb99b4cdca270729100bc0887c758d9
        with:
          pnpm: true
          use-version-file: true

      - name: Check blog post publish dates
        # Scan all blog posts for future publish dates
        id: check-dates
        continue-on-error: true
        run: |
          OUTPUT=$(node apps/site/scripts/check-blog-dates/index.mjs 2>&1)
          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            # Format JSON output as markdown table for PR comment
            echo "| Post | Title | Publish Date | Days in Future |" > /tmp/table.md
            echo "|------|-------|--------------|----------------|" >> /tmp/table.md
            echo "$OUTPUT" | jq -r '.[] | "| \(.slug) | \(.title) | \(.date) | \(.daysInFuture) |"' >> /tmp/table.md

            echo "FUTURE_POSTS<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/table.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "HAS_FUTURE_POSTS=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_FUTURE_POSTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Request changes on PR
        # Request changes to block merge until dates are verified
        if: steps.check-dates.outputs.HAS_FUTURE_POSTS == 'true' && github.event_name == 'pull_request_target'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          FUTURE_POSTS: ${{ steps.check-dates.outputs.FUTURE_POSTS }}
        with:
          script: |
            const { createReviewForFutureDates } = await import('${{github.workspace}}/apps/site/scripts/check-blog-dates/create-review.mjs')
            await createReviewForFutureDates({github, context, core})
